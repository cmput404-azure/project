# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI Pipeline

on:
  push:
    branches: [ "deployment" ]
  pull_request:
    branches: [ "deployment", "development", "production" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]
        python-version: [ "3.10" ]

    steps:
    - uses: actions/checkout@v4

    # Setup and Build Frontend
    - uses: oven-sh/setup-bun@v2
    - name: Build Frontend
      working-directory: ./frontend
      run: |
        bun i
        CI=false bun run build

    # Setup Python and Install Dependencies for Django
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Python dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Run Django Unit Tests
    - name: Run Django tests
      working-directory: ./backend
      env:
        DJANGO_SETTINGS_MODULE: server.settings  # Replace with your Django settings module path if different
      run: |
        python manage.py test
